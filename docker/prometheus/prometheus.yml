# docker/prometheus/prometheus.yml
# Prometheus configuration for resume-ecosystem-node

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "resume-ecosystem"

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # API Gateway
  - job_name: "api-gateway"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Auth Service
  - job_name: "auth-service"
    static_configs:
      - targets: ["host.docker.internal:4010"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Activity Service
  - job_name: "activity-service"
    static_configs:
      - targets: ["host.docker.internal:4020"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Verification Service
  - job_name: "verification-service"
    static_configs:
      - targets: ["host.docker.internal:4030"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Resume Service
  - job_name: "resume-service"
    static_configs:
      - targets: ["host.docker.internal:4040"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Integration Service
  - job_name: "integration-service"
    static_configs:
      - targets: ["host.docker.internal:4050"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Notification Service
  - job_name: "notification-service"
    static_configs:
      - targets: ["host.docker.internal:4060"]
    metrics_path: /metrics
    scrape_interval: 10s

  # File Service
  - job_name: "file-service"
    static_configs:
      - targets: ["host.docker.internal:4070"]
    metrics_path: /metrics
    scrape_interval: 10s
