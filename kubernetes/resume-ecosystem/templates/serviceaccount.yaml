# kubernetes/resume-ecosystem/templates/serviceaccount.yaml
# ServiceAccount for resume-ecosystem pods

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "resume-ecosystem.serviceAccountName" . }}
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}

{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.labels" . | nindent 4 }}
rules:
  # Allow pods to read configmaps and secrets in their namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow pods to read their own pod info
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "resume-ecosystem.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "resume-ecosystem.serviceAccountName" . }}
    namespace: {{ include "resume-ecosystem.namespace" . }}
{{- end }}
