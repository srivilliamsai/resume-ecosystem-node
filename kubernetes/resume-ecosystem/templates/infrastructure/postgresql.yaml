# kubernetes/resume-ecosystem/templates/infrastructure/postgresql.yaml
# PostgreSQL StatefulSet for resume-ecosystem

{{- if and .Values.postgresql.enabled (not .Values.postgresql.external.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}-postgresql
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.serviceLabels" (list . "postgresql") | nindent 4 }}
spec:
  serviceName: {{ include "resume-ecosystem.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "resume-ecosystem.serviceSelectorLabels" (list . "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resume-ecosystem.serviceSelectorLabels" (list . "postgresql") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "resume-ecosystem.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "resume-ecosystem.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: resume_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - resume_db
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - resume_db
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "resume-ecosystem.serviceLabels" (list . "postgresql") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}-postgresql
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.serviceLabels" (list . "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "resume-ecosystem.serviceSelectorLabels" (list . "postgresql") | nindent 4 }}

---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}-postgresql-headless
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.serviceLabels" (list . "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "resume-ecosystem.serviceSelectorLabels" (list . "postgresql") | nindent 4 }}
{{- end }}
