# kubernetes/resume-ecosystem/templates/secrets.yaml
# Sensitive configuration for resume-ecosystem services
#
# IMPORTANT: In production, use one of these approaches instead:
# 1. External Secrets Operator with AWS Secrets Manager/HashiCorp Vault
# 2. Sealed Secrets (Bitnami)
# 3. SOPS with age/PGP encryption
# 4. Kubernetes secrets injected via CI/CD pipeline

{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resume-ecosystem.fullname" . }}-secrets
  namespace: {{ include "resume-ecosystem.namespace" . }}
  labels:
    {{- include "resume-ecosystem.labels" . | nindent 4 }}
  annotations:
    # Prevent accidental deletion
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # JWT Secret - CRITICAL: Change in production!
  # Generate with: openssl rand -base64 64
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # Database connection URL
  POSTGRES_URL: {{ include "resume-ecosystem.postgresUrl" . | quote }}

  # PostgreSQL credentials (for StatefulSet)
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # Seed admin credentials
  SEED_ADMIN_EMAIL: {{ .Values.secrets.seedAdminEmail | quote }}
  SEED_ADMIN_PASSWORD: {{ .Values.secrets.seedAdminPassword | quote }}

  {{- if .Values.notificationService.smtp.user }}
  # SMTP credentials
  SMTP_USER: {{ .Values.notificationService.smtp.user | quote }}
  {{- end }}
{{- end }}

---
# Docker registry credentials (if using private registry)
{{- if .Values.global.imagePullSecrets }}
{{- range .Values.global.imagePullSecrets }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ include "resume-ecosystem.namespace" $ }}
  labels:
    {{- include "resume-ecosystem.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .dockerConfigJson | b64enc }}
{{- end }}
{{- end }}
{{- end }}
