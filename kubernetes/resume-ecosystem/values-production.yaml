# kubernetes/resume-ecosystem/values-production.yaml
# Production-specific overrides for resume-ecosystem
#
# Usage:
#   helm install resume-ecosystem ./kubernetes/resume-ecosystem \
#     -f ./kubernetes/resume-ecosystem/values.yaml \
#     -f ./kubernetes/resume-ecosystem/values-production.yaml \
#     --set secrets.jwtSecret="$(openssl rand -base64 64)" \
#     --set secrets.postgresPassword="$(openssl rand -base64 32)"

global:
  environment: production
  domain: api.resume-ecosystem.com

config:
  nodeEnv: production
  logLevel: warn

# Increased replicas for production
apiGateway:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

authService:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

activityService:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

verificationService:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

resumeService:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

integrationService:
  replicaCount: 2

notificationService:
  replicaCount: 2

fileService:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  persistence:
    size: 50Gi

# Production PostgreSQL settings
postgresql:
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Production Redis settings
redis:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Production Kafka settings
kafka:
  strimzi:
    replicas: 3
    storage:
      size: 50Gi
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi

# Production ingress with TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.resume-ecosystem.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
  tls:
    - secretName: resume-ecosystem-tls
      hosts:
        - api.resume-ecosystem.com

# Production observability with persistence
observability:
  prometheus:
    persistence:
      enabled: true
      size: 100Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  grafana:
    persistence:
      enabled: true
      size: 10Gi

# Enable PodDisruptionBudgets
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Enable network policies
networkPolicy:
  enabled: true
