# kubernetes/resume-ecosystem/Chart.yaml
# Helm chart for resume-ecosystem-node microservices platform

apiVersion: v2
name: resume-ecosystem
description: |
  A Helm chart for deploying the Resume Ecosystem - a next-gen resume builder
  that auto-generates verified resumes from internships, hackathons, courses,
  and projects using event-driven architecture.

type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - resume
  - microservices
  - nodejs
  - typescript
  - kafka
  - postgresql

home: https://github.com/your-org/resume-ecosystem-node
sources:
  - https://github.com/your-org/resume-ecosystem-node

maintainers:
  - name: Resume Ecosystem Team
    email: team@example.com

dependencies:
  # Optional: Use Bitnami PostgreSQL chart instead of our StatefulSet
  # - name: postgresql
  #   version: "13.x.x"
  #   repository: https://charts.bitnami.com/bitnami
  #   condition: postgresql.external.enabled

  # Optional: Use Bitnami Redis chart
  # - name: redis
  #   version: "18.x.x"
  #   repository: https://charts.bitnami.com/bitnami
  #   condition: redis.external.enabled

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
