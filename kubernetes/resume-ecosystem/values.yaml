# kubernetes/resume-ecosystem/values.yaml
# Default configuration values for resume-ecosystem Helm chart

# =============================================================================
# Global Configuration
# =============================================================================
global:
  # Image pull policy for all containers
  imagePullPolicy: IfNotPresent

  # Image registry (override for private registries)
  imageRegistry: ""

  # Image pull secrets for private registries
  imagePullSecrets: []
  # - name: my-registry-secret

  # Namespace to deploy into (uses Release.Namespace if empty)
  namespace: ""

  # Environment (development, staging, production)
  environment: production

  # Domain for ingress
  domain: resume-ecosystem.example.com

  # Enable/disable specific components
  components:
    observability: true
    ingress: true

# =============================================================================
# Shared Environment Configuration (ConfigMap)
# =============================================================================
config:
  # Node.js environment
  nodeEnv: production

  # Log level (trace, debug, info, warn, error, fatal)
  logLevel: info

  # JWT token expiration
  jwtExpiration: "2h"

  # OpenTelemetry settings
  otelEnabled: "true"
  otelExporterEndpoint: "http://jaeger:4318"

  # Metrics
  metricsEnabled: "true"

# =============================================================================
# Secrets Configuration
# =============================================================================
secrets:
  # Create secrets (set to false if using external secrets manager)
  create: true

  # External secrets name (if create is false)
  existingSecret: ""

  # JWT secret (REQUIRED - generate with: openssl rand -base64 64)
  # In production, use external secrets manager or sealed secrets
  jwtSecret: "CHANGE_ME_IN_PRODUCTION_USE_SEALED_SECRETS"

  # Database credentials
  postgresUser: postgres
  postgresPassword: "CHANGE_ME_IN_PRODUCTION"

  # Seed admin credentials
  seedAdminEmail: "admin@example.com"
  seedAdminPassword: "CHANGE_ME_IN_PRODUCTION"

# =============================================================================
# Microservices Configuration
# =============================================================================

# API Gateway (port 4000)
apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/api-gateway
    tag: latest
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Auth Service (port 4010)
authService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/auth-service
    tag: latest
  port: 4010
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

# Activity Service (port 4020)
activityService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/activity-service
    tag: latest
  port: 4020
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

# Verification Service (port 4030)
verificationService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/verification-service
    tag: latest
  port: 4030
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

# Resume Service (port 4040)
resumeService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/resume-service
    tag: latest
  port: 4040
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

# Integration Service (port 4050)
integrationService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/integration-service
    tag: latest
  port: 4050
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

# Notification Service (port 4060)
notificationService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/notification-service
    tag: latest
  port: 4060
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  # SMTP configuration (if using email notifications)
  smtp:
    host: ""
    port: 587
    user: ""
    # Password should be in secrets
    from: "noreply@example.com"

# File Service (port 4070)
fileService:
  enabled: true
  replicaCount: 2
  image:
    repository: resume-ecosystem/file-service
    tag: latest
  port: 4070
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  # Persistent storage for generated files
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# =============================================================================
# Infrastructure Components
# =============================================================================

# PostgreSQL Database
postgresql:
  enabled: true
  # Use external database instead of deploying one
  external:
    enabled: false
    host: ""
    port: 5432
    database: resume_db
  # Internal PostgreSQL settings
  image:
    repository: postgres
    tag: "15-alpine"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Redis Cache
redis:
  enabled: true
  # Use external Redis instead
  external:
    enabled: false
    host: ""
    port: 6379
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Kafka (via Strimzi Operator)
kafka:
  enabled: true
  # Assumes Strimzi operator is already installed
  # Install with: kubectl create -f https://strimzi.io/install/latest
  strimzi:
    # Use existing Kafka cluster
    existingCluster: ""
    # Create new Kafka cluster
    create: true
    version: "3.6.0"
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    # Zookeeper settings (required for Kafka < 3.4 without KRaft)
    zookeeper:
      replicas: 3
      storage:
        size: 5Gi
  # Kafka topics to create
  topics:
    - name: activity.created
      partitions: 6
      replicas: 3
      config:
        retention.ms: "604800000"  # 7 days
    - name: activity.verified
      partitions: 6
      replicas: 3
      config:
        retention.ms: "604800000"
    - name: resume.version.published
      partitions: 6
      replicas: 3
      config:
        retention.ms: "604800000"
    - name: integration.webhook.received
      partitions: 3
      replicas: 3
      config:
        retention.ms: "86400000"  # 1 day

# =============================================================================
# Observability Stack
# =============================================================================

observability:
  # Jaeger for distributed tracing
  jaeger:
    enabled: true
    image:
      repository: jaegertracing/all-in-one
      tag: "1.53"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # Prometheus (for metrics collection)
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: "v2.48.0"
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

  # Grafana (for dashboards)
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: "10.2.2"
    adminUser: admin
    # Admin password - change in production!
    adminPassword: "admin"
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# =============================================================================
# Ingress Configuration
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.resume-ecosystem.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
    - host: resume-ecosystem.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web-app
  tls:
    - secretName: resume-ecosystem-tls
      hosts:
        - api.resume-ecosystem.example.com
        - resume-ecosystem.example.com

# =============================================================================
# Service Account & RBAC
# =============================================================================

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# =============================================================================
# Pod Disruption Budgets
# =============================================================================

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# =============================================================================
# Network Policies
# =============================================================================

networkPolicy:
  enabled: false
  # Allow traffic only from specific namespaces
  allowedNamespaces: []
